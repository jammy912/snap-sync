  <rect width="512" height="512" rx="112" fill="#12181c"/>
  <g fill="none" stroke="#39c5b3" stroke-width="26"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M104 196a34 34 0 0 1 34-34h44l30-42h96l30 42h44a34 34 0 0 1 34 34v144a34 34 0 0 1-34 34H138a34 34 0 0 1-34-34z"/>
    <circle cx="256" cy="272" r="72"/>
  </g>
</svg>
