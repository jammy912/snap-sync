<!-- PWA 主畫面圖示。風格與 App 內的相機按鈕一致：線條、圓端點、
     康庭青綠 #39c5b3。maskable 用途要求重要內容留在中央 80% 的安全區內
     （Android 會裁成圓形／方圓形），故相機本體只佔中央區域。 -->
